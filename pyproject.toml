# cu128 dev/runtime environment for this mmdetection fork.
#
# uv *virtual* project (not itself a package). `uv sync` provisions the validated
# cu128 stack (torch 2.8.0+cu128, mmcv 2.2.0 self-hosted cu128 wheel, mmengine 0.10.x,
# numpy<2) plus mmdet's runtime deps. `just sync` then puts this pure-Python
# mmdet source on the venv path via a .pth file (develop-style).
[project]
name = "mmdet-cu128-devenv"
version = "0.0.0"
description = "cu128 (torch 2.8.0 + cu128) dev/runtime env for the mmdetection fork"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "numpy<2",
    "mmcv==2.2.0",
    "mmengine>=0.10,<1.0",
    "setuptools<81",
    "wheel",
    # mmdet runtime deps (requirements/runtime.txt):
    "matplotlib",
    "pycocotools",
    "scipy",
    "shapely",
    "six",
    "terminaltables",
    "tqdm",
    # backend for AdaBeliefOptimizer (pure-Python). The Adan backend is installed
    # separately via `just install-adan` (its setup.py builds a CUDA fused kernel).
    "adabelief-pytorch",
]

[tool.uv]
package = false

[tool.uv.sources]
mmcv = { url = "https://github.com/yuki-inaho/mmcv/releases/download/cu128-wheels-v0.1/mmcv-2.2.0-0sm120t280-cp310-cp310-linux_x86_64.whl" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
